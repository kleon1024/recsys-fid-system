[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-fid-system"
version = "0.2.0"
description = "Executable reference architecture for Feed and Local Service recommendation systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kleon1024" }]
keywords = ["recommendation-system", "ranking", "retrieval", "ab-testing", "fid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/kleon1024/recsys-fid-system"
Issues = "https://github.com/kleon1024/recsys-fid-system/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["fid_lab*"]

[tool.maestro_dataeng.architecture]
source_roots = ["."]
oracle_paths = ["tests/**/test_*.py"]
entry_points = [
