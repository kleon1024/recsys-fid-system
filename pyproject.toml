[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-fid-system"
version = "0.2.0"
description = "Executable reference architecture for Feed and Local Service recommendation systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kleon1024" }]
keywords = ["recommendation-system", "ranking", "retrieval", "ab-testing", "fid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/kleon1024/recsys-fid-system"
Issues = "https://github.com/kleon1024/recsys-fid-system/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["fid_lab*"]

[tool.maestro_dataeng.architecture]
source_roots = ["."]
oracle_paths = ["tests/**/test_*.py"]
entry_points = [
  "fid_lab/evolution/data/joiner.py",
  "fid_lab/evolution/data/request_dataset.py",
  "fid_lab/evolution/data/request_dataset_cli.py",
  "fid_lab/scale/dataset.py",
  "fid_lab/scale/diagnostics.py",
  "fid_lab/simulation/experimentation/assignment.py",
  "fid_lab/simulation/local/launch_suite.py",
  "fid_lab/value/container.py",
  "fid_lab/value/gate.py",
  "fid_lab/feed_loop/scale/tensor_catalog.py",
  "fid_lab/feed_loop/world_model/cli.py",
  "fid_lab/feed_loop/world_model/release/cli.py",
  "fid_lab/feed_loop/world_model/validation/evaluation.py",
  "fid_lab/feed_loop/world_model/benchmark/cli.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/sequence_dataset.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/randomized_dataset.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/randomized_benchmark.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/randomized_adapter.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/randomized_shadow.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/core_bridge.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/retrieval/ladder.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/retrieval/review.py",
  "fid_lab/feed_loop/world_model/external/ope_cli.py",
  "fid_lab/feed_loop/world_model/external/kuairand/cli/sequence_benchmark.py",
  "fid_lab/feed_loop/world_model/external/kuairand/kernel.py",
  "fid_lab/feed_loop/world_model/external/replay.py",
  "fid_lab/evolution/models/esmm.py",
  "fid_lab/simulation/features/groups.py",
  "fid_lab/feed_loop/models/feature_lr.py",
  "fid_lab/feed_loop/models/feature_lr_cli.py",
  "fid_lab/feed_loop/scale/artifact/feature_lr_cli.py",
  "fid_lab/feed_loop/release.py",
  "fid_lab/launches/ledger_cli.py",
  "fid_lab/feed_loop/scale/queue_value_cli.py",
  "fid_lab/value/tree.py",
  "fid_lab/simulation/local/switchback.py",
  "fid_lab/simulation/local/switchback_cli.py",
]
authority_modules = [
  "fid_lab.fid",
  "fid_lab.schema",
  "fid_lab.online.config",
  "fid_lab.training.contracts",
  "fid_lab.training.joiner",
  "fid_lab.poi_posting.contracts",
  "fid_lab.poi_feed.contracts",
  "fid_lab.surfaces.contracts",
  "fid_lab.scale.contracts",
  "fid_lab.evolution.data.contracts",
  "fid_lab.simulation.experimentation.contracts",
  "fid_lab.value.contracts",
  "fid_lab.value.container",
  "fid_lab.value.gate",
  "fid_lab.value.tree",
  "fid_lab.feed_loop.world_model.contracts",
  "fid_lab.feed_loop.world_model.benchmark.contracts",
